[package]
name = "ntfry-tracker"
version = "1.9.2"
edition = "2021"
description = "NETFORY (ntfry) lightweight P2P discovery tracker (in-memory, signed announces, TTL heartbeat)"

[[bin]]
name = "ntfry-tracker"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout", "catch-panic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secp256k1 = { version = "0.29", features = ["std"] }
sha2 = "0.10"
ripemd = "0.1"
bs58 = { version = "0.5", features = ["check"] }
hex = "0.4"
ed25519-dalek = "2"
sled = "0.34"
ureq = { version = "2", features = ["tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[profile.release]
opt-level = "z"
lto = true
strip = true
